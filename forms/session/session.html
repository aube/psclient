<form class="form-session contact-form-wrapper" method="post" enctype="multipart/form-data">

  <div class="form-group">
    <label class="form-label" for="name-input">{{labels_name}}</label>
    <input type="text" id="name-input" class="form-input" name="name" placeholder="{{placeholders_name}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="email-input">{{labels_email}}</label>
    <input type="email" id="email-input" class="form-input" name="email" placeholder="{{placeholders_email}}">
  </div>

  <div class="form-group">
    <label class="form-label" for="phone-input">{{labels_phone}}</label>
    <input type="text" id="phone-input" class="form-input" name="phone" placeholder="{{placeholders_phone}}">
  </div>

  <div class="form-group">
    <label class="form-label">{{labels_consultation_type}}</label>
    <ul class="space-y-3">
      <li>
        <label class="radio-label">
          <input type="radio" id="consult-type-Offline" class="radio-input" name="consultation_type"
            value="{{options_consultation_offline}}" required>
          <span class="radio-custom"></span>
          <span class="radio-text">{{options_consultation_offline}}</span>
        </label>
      </li>
      <li>
        <label class="radio-label">
          <input type="radio" id="consult-type-Online" class="radio-input" name="consultation_type"
            value="Онлайн-консультация" required>
          <span class="radio-custom"></span>
          <span class="radio-text">{{options_consultation_online}}</span>
        </label>
      </li>
    </ul>
  </div>

  <div class="form-group">
    <textarea class="form-input" name="question" placeholder="{{placeholders_question}}"></textarea>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" class="checkbox-input" name="privacy_consent" value="1">
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">{{labels_privacy_consent}} <a href="{{link_privacy_policy}}" target="_blank"
          class="underline text-action-primary">{{link_privacy_policy_text}}</a></span>
    </label>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" class="checkbox-input" name="personal_data_consent" value="1">
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">{{labels_personal_data_consent}} <a href="{{link_personal_data}}" target="_blank"
          class="underline text-action-primary">{{link_personal_data_text}}</a></span>
    </label>
  </div>

  <p class="text-xs text-content-secondary hidden" id="consent-error">{{labels_consent_error}}</p>

  <button type="submit" class="btn-submit">{{buttons_submit}}</button>
</form>
