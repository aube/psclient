<form class="form contact-form-wrapper" method="post" enctype="multipart/form-data">

  <div class="form-group">
    <label class="form-label" for="name-input">{{labels_name}}</label>
    <input type="text" id="name-input" class="form-input" name="name" placeholder="{{placeholders_name}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="email-input">{{labels_email}}</label>
    <input type="email" id="email-input" class="form-input" name="email" placeholder="{{placeholders_email}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="phone-input">{{labels_phone}}</label>
    <input type="text" id="phone-input" class="form-input" name="phone" placeholder="{{placeholders_phone}}" required>
  </div>

  <div class="form-group">
    <label class="form-label">{{labels_consultation_type}}</label>
    <ul class="space-y-3">
      <li>
        <label class="checkbox-label">
          <input type="checkbox" id="consult-type-Offline" class="checkbox-input" name="consultation_type[]"
            value="{{options_consultation_offline}}" required>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">{{options_consultation_offline}}</span>
        </label>
      </li>
      <li>
        <label class="checkbox-label">
          <input type="checkbox" id="consult-type-Online" class="checkbox-input" name="consultation_type[]"
            value="Онлайн-консультация" required>
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">{{options_consultation_online}}</span>
        </label>
      </li>
    </ul>
  </div>

  <div class="form-group">
    <textarea class="form-input" name="question" placeholder="{{placeholders_question}}" required></textarea>
  </div>

  <button type="submit" class="btn-submit">{{buttons_submit}}</button>
</form>
