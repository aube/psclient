<form class="form-preorder contact-form-wrapper space-y-6" method="post" enctype="multipart/form-data">

  <p class="text-base font-medium">{{section_personal}}</p>

  <div class="form-group">
    <label class="form-label" for="full-name-input">{{labels_full_name}}</label>
    <input type="text" id="full-name-input" class="form-input" name="full_name" placeholder="{{placeholders_full_name}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="display-name-input">{{labels_display_name}}</label>
    <input type="text" id="display-name-input" class="form-input" name="display_name" placeholder="{{placeholders_display_name}}">
    <p class="text-xs text-content-secondary mt-1">{{descriptions_display_name}}</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="specialization-input">{{labels_specialization}}</label>
    <textarea id="specialization-input" class="form-input" name="specialization" placeholder="{{placeholders_specialization}}" required></textarea>
  </div>

  <div class="form-group">
    <label class="form-label" for="problems-input">{{labels_problems}}</label>
    <textarea id="problems-input" class="form-input" name="problems" placeholder="{{placeholders_problems}}" required></textarea>
    <p class="text-xs text-content-secondary mt-1">{{descriptions_problems}}</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="not-working-with-input">{{labels_not_working_with}}</label>
    <textarea id="not-working-with-input" class="form-input" name="not_working_with" placeholder="{{placeholders_not_working_with}}"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label">{{labels_diplomas}}</label>
    <p class="text-xs text-content-secondary mt-1">{{descriptions_diplomas}}</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="experience-input">{{labels_experience}}</label>
    <input type="text" id="experience-input" class="form-input" name="experience" placeholder="{{placeholders_experience}}">
  </div>

  <div class="form-group">
    <label class="form-label" for="associations-input">{{labels_associations}}</label>
    <textarea id="associations-input" class="form-input" name="associations" placeholder="{{placeholders_associations}}"></textarea>
  </div>

  <hr class="border-border-subtle">

  <p class="text-base font-medium">{{section_contacts}}</p>

  <div class="form-group">
    <label class="form-label" for="city-input">{{labels_city}}</label>
    <input type="text" id="city-input" class="form-input" name="city" placeholder="{{placeholders_city}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="address-input">{{labels_address}}</label>
    <input type="text" id="address-input" class="form-input" name="address" placeholder="{{placeholders_address}}">
  </div>

  <div class="form-group">
    <label class="form-label" for="phone-input">{{labels_phone}}</label>
    <input type="tel" id="phone-input" class="form-input" name="phone" placeholder="{{placeholders_phone}}" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="messengers-input">{{labels_messengers}}</label>
    <input type="text" id="messengers-input" class="form-input" name="messengers" placeholder="{{placeholders_messengers}}">
    <p class="text-xs text-content-secondary mt-1">{{descriptions_messengers}}</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="social-input">{{labels_social}}</label>
    <input type="text" id="social-input" class="form-input" name="social" placeholder="{{placeholders_social}}">
  </div>

  <hr class="border-border-subtle">

  <p class="text-base font-medium">{{section_pricing}}</p>

  <div class="form-group">
    <label class="form-label">{{labels_consultation_types}}</label>
    <ul class="space-y-3">
      <li>
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-input" name="consultation_types[]" value="{{options_consultation_individual}}">
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">{{options_consultation_individual}}</span>
        </label>
      </li>
      <li>
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-input" name="consultation_types[]" value="{{options_consultation_family}}">
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">{{options_consultation_family}}</span>
        </label>
      </li>
      <li>
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-input" name="consultation_types[]" value="{{options_consultation_group}}">
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">{{options_consultation_group}}</span>
        </label>
      </li>
    </ul>
  </div>

  <div class="form-group">
    <label class="form-label" for="duration-input">{{labels_duration}}</label>
    <input type="number" id="duration-input" class="form-input" name="duration" placeholder="{{placeholders_duration}}" min="1">
  </div>

  <div class="form-group">
    <label class="form-label" for="cost-input">{{labels_cost}}</label>
    <input type="number" id="cost-input" class="form-input" name="cost" placeholder="{{placeholders_cost}}" min="0" step="0.01" required>
  </div>

  <div class="form-group">
    <label class="form-label" for="cancellation-input">{{labels_cancellation}}</label>
    <textarea id="cancellation-input" class="form-input" name="cancellation" placeholder="{{placeholders_cancellation}}"></textarea>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" class="checkbox-input" name="privacy_consent" value="1">
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">{{labels_privacy_consent}} <a href="{{link_privacy_policy}}" target="_blank" class="underline text-action-primary">{{link_privacy_policy_text}}</a></span>
    </label>
  </div>

  <div class="form-group">
    <label class="checkbox-label">
      <input type="checkbox" class="checkbox-input" name="personal_data_consent" value="1">
      <span class="checkbox-custom"></span>
      <span class="checkbox-text">{{labels_personal_data_consent}} <a href="{{link_personal_data}}" target="_blank" class="underline text-action-primary">{{link_personal_data_text}}</a></span>
    </label>
  </div>

  <p class="text-xs text-content-secondary hidden" id="consent-error">{{labels_consent_error}}</p>

  <button type="submit" class="btn-submit">{{buttons_submit}}</button>
</form>
